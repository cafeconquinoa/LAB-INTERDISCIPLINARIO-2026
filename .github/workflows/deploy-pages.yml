name: Publicar dashboard Cortafuego La Reina

on:
  push:
    branches:
      - cortafuego-la-reina
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
